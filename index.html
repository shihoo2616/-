<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이번 생은 축구다</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0f14;color:#eef5f8;font-family:Arial,sans-serif}button{cursor:pointer}
.wrap{max-width:1100px;margin:auto;min-height:100vh}.top{padding:24px 20px 12px;border-bottom:1px solid #25313b}.logo{font-size:25px;font-weight:900}.green{color:#58d6a5}.muted{color:#8ea0ad}.nav{display:flex;gap:7px;padding:14px 20px;overflow:auto}.nav button,.btn{border:1px solid #2b3944;background:#131c24;color:#dce6ec;border-radius:8px;padding:10px 14px}.nav button.on,.btn.main{background:#58d6a5;color:#07130e;border-color:#58d6a5;font-weight:800}.content{padding:8px 20px 30px}.hero{background:linear-gradient(130deg,#13241f,#111922);border:1px solid #2a3a42;border-radius:14px;padding:24px;margin-bottom:14px}.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.card{background:#121a22;border:1px solid #273540;border-radius:12px;padding:17px}.card h2,.card h3{margin-top:0}.big{font-size:42px;font-weight:900}.score{font-size:38px;font-weight:900}.match{display:flex;justify-content:space-between;align-items:center;text-align:center;gap:12px}.team{flex:1}.team b{display:block;font-size:18px;margin-top:7px}.bar{height:8px;background:#26333d;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#58d6a5}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #202c35}.row:last-child{border:0}.small{font-size:12px}.loading{position:fixed;inset:0;background:#080d12ee;display:grid;place-items:center;z-index:5}.loader{text-align:center;width:min(430px,90%)}.ball{font-size:58px;animation:spin 1.1s linear infinite;display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}.dots:after{content:"";animation:dots 1.2s steps(4,end) infinite}@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}@media(max-width:700px){.g2,.g3{grid-template-columns:1fr}.content{padding:8px 12px 25px}.nav{padding:10px 12px}.top{padding:18px 12px}.match .team b{font-size:14px}}
</style>
</head>
<body>
<div class="wrap"><header class="top"><div class="logo">⚽ 이번 생은 축구다</div><div class="muted small">FOOTBALL LIFE · CAREER MODE</div></header>
<nav class="nav" id="nav"></nav><main class="content" id="app"></main></div>
<script>
const clubs=["서울 FC","대전 시티","울산 블루","전북 모터스","부산 아이파크","광주 FC"];
let s=JSON.parse(localStorage.getItem("footballLifeSimple")||"null")||{
 name:"신인 선수",pos:"ST",club:"서울 FC",age:18,season:2026,week:1,ovr:68,potential:88,
 energy:85,form:72,trust:55,goals:0,assists:0,apps:0,wins:0,losses:0,value:4.5,
 stats:{PAC:72,FIN:70,DRI:68,PAS:55,PHY:60,STA:65},history:[]
};
let page="home";
function save(){localStorage.setItem("footballLifeSimple",JSON.stringify(s))}
function nav(){document.querySelector("#nav").innerHTML=[["home","홈"],["match","⚽ 경기"],["training","🏃 훈련"],["player","👤 내 선수"],["records","📊 기록"]].map(x=>`<button class="${page==x[0]?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}
function go(p){page=p;render()}
function bars(){return Object.entries(s.stats).map(([k,v])=>`<div class="row"><span>${k}</span><b>${v}</b></div><div class="bar"><i style="width:${v}%"></i></div>`).join("")}
function home(){return `<section class="hero"><div class="muted small">${s.season} SEASON · ${s.week}주차</div><h1>${s.name}</h1><p class="muted">${s.club} · ${s.pos} · ${s.age}세</p><div class="big green">${s.ovr}<span class="muted small"> OVR</span></div></section><div class="grid g3"><div class="card"><div class="muted small">컨디션</div><div class="big">${s.form}%</div></div><div class="card"><div class="muted small">체력</div><div class="big">${s.energy}%</div></div><div class="card"><div class="muted small">감독 신뢰도</div><div class="big">${s.trust}%</div></div></div><div class="card" style="margin-top:14px"><h3>다음 경기</h3>${matchHTML()}<button class="btn main" style="width:100%;margin-top:16px" onclick="play()">경기 시작</button></div>`}
function matchHTML(){let i=clubs.indexOf(s.club);let opp=clubs[(i+s.week)%clubs.length];if(opp==s.club)opp=clubs[(i+1)%clubs.length];return `<div class="match"><div class="team">HOME<b>${s.club}</b></div><div class="score">VS</div><div class="team">AWAY<b>${opp}</b></div></div>`}
function match(){return `<div class="hero"><div class="muted small">MATCH DAY</div><h2>${s.season} · ${s.week}주차</h2>${matchHTML()}<button class="btn main" style="margin-top:20px;width:100%" onclick="play()">⚽ 경기 시작</button></div><div class="card"><h3>경기 전 상태</h3><div class="row"><span>체력</span><b>${s.energy}%</b></div><div class="row"><span>컨디션</span><b>${s.form}%</b></div><div class="row"><span>감독 신뢰도</span><b>${s.trust}%</b></div></div>`}
function training(){return `<div class="hero"><h2>훈련</h2><p class="muted">복잡한 메뉴 대신 세 가지 훈련만 선택하세요.</p></div><div class="grid g3">${[["기술 훈련","드리블·결정력·패스","technical"],["피지컬 훈련","속도·체력·피지컬","physical"],["휴식","체력·컨디션 회복","rest"]].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="muted small">${x[1]}</p><button class="btn main" onclick="train('${x[2]}')">훈련하기</button></div>`).join("")}</div>`}
function player(){return `<div class="grid g2"><div class="card"><h2>${s.name}</h2><div class="row"><span>포지션</span><b>${s.pos}</b></div><div class="row"><span>나이</span><b>${s.age}세</b></div><div class="row"><span>잠재력</span><b>${s.potential}</b></div><div class="row"><span>시장가치</span><b>€${s.value.toFixed(1)}M</b></div></div><div class="card"><h3>능력치</h3>${bars()}</div></div>`}
function records(){return `<div class="grid g3"><div class="card"><div class="muted small">출전</div><div class="big">${s.apps}</div></div><div class="card"><div class="muted small">골</div><div class="big">${s.goals}</div></div><div class="card"><div class="muted small">승리</div><div class="big">${s.wins}</div></div></div><div class="card" style="margin-top:14px"><h3>최근 경기</h3>${s.history.length?s.history.slice(0,8).map(h=>`<div class="row"><span>${h.season} · ${h.opponent}</span><b>${h.result} · ${h.rating}</b></div>`).join(""):`<div class="muted">아직 경기 기록이 없습니다.</div>`}</div>`}
function render(){nav();document.querySelector("#app").innerHTML=({home,match,training,player,records}[page])()}
function loading(text,done){let e=document.createElement("div");e.className="loading";e.innerHTML=`<div class="loader"><div class="ball">⚽</div><h2>${text}<span class="dots"></span></h2><div class="bar"><i id="loadbar" style="width:5%"></i></div><p class="muted small">경기 데이터를 준비하고 있습니다</p></div>`;document.body.append(e);let n=5,t=0;let timer=setInterval(()=>{n+=9;document.querySelector("#loadbar").style.width=n+"%";t++;if(t==3)e.querySelector("h2").innerHTML="전반전 진행 중<span class='dots'></span>";if(t==6)e.querySelector("h2").innerHTML="후반전 진행 중<span class='dots'></span>";if(t>=10){clearInterval(timer);e.remove();done()}},230)}
function play(){if(s.energy<15){alert("체력이 부족합니다. 먼저 휴식하세요.");return}loading("경기중",()=>{let i=clubs.indexOf(s.club),opp=clubs[(i+s.week)%clubs.length];if(opp==s.club)opp=clubs[(i+1)%clubs.length];let win=Math.random()<(0.48+(s.ovr-68)/180);let goal=Math.random()<0.42+(s.form-70)/300;let result=win?"승리":"패배";if(Math.random()<.2)result="무승부";s.apps++;s.energy=Math.max(0,s.energy-20);s.form=Math.max(35,Math.min(100,s.form+(win?4:-2)));s.trust=Math.max(15,Math.min(95,s.trust+(win?3:-1)));if(win)s.wins++;if(result=="패배")s.losses++;if(goal)s.goals++;if(Math.random()<.25)s.assists++;let rating=(6.3+(win?1:.0)+(goal?.9:0)+Math.random()*.6).toFixed(1);s.history.unshift({season:s.season,opponent:opp,result,rating});s.week++;if(s.week>34){s.season++;s.week=1;s.age++;s.energy=90;s.form=75;alert("🎉 시즌 종료! 다음 시즌이 시작됩니다.")}save();showResult(opp,result,goal,rating)})}
function showResult(opp,result,goal,rating){document.querySelector("#app").innerHTML=`<div class="hero" style="text-align:center"><div class="green">FULL TIME</div><h1>${result}</h1><div class="match" style="margin:28px 0"><div class="team"><b>${s.club}</b></div><div class="score">${result=="승리"?"2":"1"} : ${result=="승리"?"1":"2"}</div><div class="team"><b>${opp}</b></div></div><h2>${goal?"⚽ GOAL!":"경기 종료"}</h2><p class="muted">평점 ${rating} · ${goal?"득점 1":"득점 없음"} · 감독 신뢰도 ${s.trust}%</p><button class="btn main" onclick="go('home')">확인</button></div>`}
function train(type){loading("훈련중",()=>{if(type=="technical"){s.stats.DRI=Math.min(s.potential,s.stats.DRI+3);s.stats.FIN=Math.min(s.potential,s.stats.FIN+2);s.energy=Math.max(0,s.energy-12)}else if(type=="physical"){s.stats.PAC=Math.min(s.potential,s.stats.PAC+2);s.stats.PHY=Math.min(s.potential,s.stats.PHY+3);s.energy=Math.max(0,s.energy-18)}else{s.energy=Math.min(100,s.energy+30);s.form=Math.min(100,s.form+7)}s.ovr=Math.round(Object.values(s.stats).reduce((a,b)=>a+b,0)/Object.values(s.stats).length);s.week++;if(s.week>34){s.season++;s.week=1;s.age++}save();go("home")})}
render();
</script></body></html>
